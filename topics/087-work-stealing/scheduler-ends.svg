<svg xmlns="http://www.w3.org/2000/svg" width="840" height="260" viewBox="0 0 840 260" role="img" aria-labelledby="title desc">
  <title id="title">Owner and thief take opposite ends of a work-stealing deque</title>
  <desc id="desc">An owner pops the newest task from the right. An idle thief steals an older task from the left.</desc>
  <style>text{font-family:system-ui,sans-serif;fill:#152238}.label{font-size:18px;font-weight:700}.small{font-size:15px}.box{stroke:#152238;stroke-width:2;rx:6}.arrow{stroke:#165d9c;stroke-width:3;fill:none;marker-end:url(#head)}</style>
  <defs><marker id="head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#165d9c"/></marker></defs>
  <text x="30" y="34" class="label">One deque, two access paths</text>
  <rect x="120" y="105" width="150" height="55" class="box" fill="#dceeff"/><text x="159" y="138" class="label">older A</text>
  <rect x="270" y="105" width="150" height="55" class="box" fill="#dceeff"/><text x="309" y="138" class="label">older B</text>
  <rect x="420" y="105" width="150" height="55" class="box" fill="#dceeff"/><text x="459" y="138" class="label">newer C</text>
  <rect x="570" y="105" width="150" height="55" class="box" fill="#dceeff"/><text x="609" y="138" class="label">newest D</text>
  <path d="M42 79 C90 79 100 117 118 125" class="arrow"/><text x="25" y="63" class="label">idle thief</text><text x="25" y="202" class="small">steals an older independent subtree</text>
  <path d="M800 79 C750 79 738 117 722 125" class="arrow"/><text x="724" y="63" class="label">owner</text><text x="574" y="202" class="small">takes newest work for locality</text>
  <text x="280" y="238" class="small">The simulation uses this policy: owner pop-right, thief pop-left.</text>
</svg>
